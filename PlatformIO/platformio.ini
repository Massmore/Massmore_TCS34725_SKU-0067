; ============================================================================
;  Massmore_TCS34725 (SKU-0067) — PlatformIO multi-target project
;  https://www.massmore.shop
;
;  เปิดโฟลเดอร์นี้ใน VS Code แล้วกด Build / Upload ได้ทันที ไม่ต้องติดตั้งอะไรเพิ่ม
;  ไลบรารีอยู่ใน lib/Massmore_TCS34725/ (ไม่มี dependency ภายนอก ไม่ใช้ lib_deps)
;
;  src/main.cpp = 07_Factory_Test
;  ลองตัวอย่างอื่น: copy ไฟล์ .ino จาก ArduinoIDE/Massmore_TCS34725/examples/<name>/
;  มาทับ src/main.cpp (บรรทัด #include <Arduino.h> มีอยู่ในทุกตัวอย่างแล้ว)
; ============================================================================

[platformio]
default_envs = esp32dev
src_dir = src
lib_dir = lib

[env]
framework = arduino
monitor_speed = 115200
build_flags = -Wall -Wextra

; ---------------------------------------------------------------------------
;  ESP32 family — pin pioarduino เพื่อให้ได้ Arduino-ESP32 Core 3.x
;  (platform = espressif32 ตัวทางการยังค้างที่ Core 2.0.17)
;  55.03.312 = Arduino-ESP32 Core 3.3.12  (สำรอง: 55.03.311 = Core 3.3.11)
; ---------------------------------------------------------------------------
[esp32_common]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312/platform-espressif32.zip
upload_speed = 512000          ; ค่าหลักสำหรับ Mac
; upload_speed = 921600        ; เร็วกว่า ถ้าสาย / ชิป USB นิ่ง
; upload_speed = 460800        ; ทางเลือก ถ้ายังอัปโหลดไม่นิ่ง
monitor_filters = esp32_exception_decoder
; ถ้ามีหลายพอร์ต ให้ระบุเอง เช่น
;   upload_port  = /dev/cu.usbserial-1130
;   monitor_port = /dev/cu.usbserial-1130

[env:esp32dev]
extends = esp32_common
board = esp32dev

[env:esp32-s3-devkitc-1]
extends = esp32_common
board = esp32-s3-devkitc-1
; MOMO S3 ใช้ USB-UART ภายนอก → 0 ; DevKit ที่ใช้ native USB ให้เปลี่ยนเป็น 1
build_flags = ${env.build_flags} -DARDUINO_USB_CDC_ON_BOOT=0

; ---------- AVR: Arduino Nano (ATmega328P) ----------
[env:nano]
platform = atmelavr
board = nanoatmega328new       ; bootloader ใหม่ (115200)
; board = nanoatmega328        ; ทางเลือก: bootloader เก่า (57600) ถ้าอัปโหลดไม่ขึ้น
build_flags = -Wall
