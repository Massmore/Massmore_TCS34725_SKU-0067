sentence=Dependency-free driver for the ams-OSRAM TCS34725 / TCS34727 RGBC color sensor (Massmore SKU-0067).
paragraph=Atomic 8-byte RGBC block read, blocking and non-blocking (FSM) APIs, DN40 lux / CCT with IR rejection and saturation detection, auto-range, dark / white calibration, RGB888 / HSV, interrupt thresholds with persistence and low-power wait, plus chip ID / authenticity self-test. No dynamic allocation, no delay() loops, runs on ESP32, ESP32-S3 and AVR (Arduino Nano). Tested with Arduino-ESP32 core 3.x.
